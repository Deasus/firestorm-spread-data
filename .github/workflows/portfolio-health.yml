# PORTFOLIO PIPELINE HEALTH MONITOR
#
# WHY THIS EXISTS. firestorm-spread-data failed 69 CONSECUTIVE RUNS
# (2026-07-31 → 2026-08-05) and nobody noticed. Operators were served 5-day-old
# fire-spread forecasts at 62.8% coverage. Two separate failures made that
# possible, and the second one is the one that matters:
#
#   1. An upstream filename change broke the fetch (fixed in fb51e30).
#   2. NOTHING WAS WATCHING. The repo was absent from firestorm-health's
#      PIPELINES list, and firestorm-health only runs when a human remembers
#      to type it.
#
# GitHub already emails on workflow failure — but those go to the Deasus
# account, which nobody reads (Deep, 2026-08-05). So email is NOT a working
# alert channel. This job writes to a GitHub ISSUE instead: it is visible in
# the repo UI without depending on anyone's inbox, it accumulates history, and
# it auto-closes when the fleet recovers.
#
# WHY IT LIVES IN THIS REPO: GHA schedules only run from a repo's DEFAULT
# branch, and FIRESTORM's `main` is the live Prod alias — adding workflows
# there is a production touch that needs explicit sign-off. This repo is a
# data pipeline with a quiet default branch, so it is the low-blast-radius
# home. Relocating later is a file move; nothing here is spread-specific.
name: Portfolio Pipeline Health

on:
  schedule:
    - cron: '17 */6 * * *'      # every 6h, offset off the hour to avoid cron pileup
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check every cron pipeline for failure streaks + stale/incomplete data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request, datetime

          OWNER = "Deasus"
          STREAK_THRESHOLD = 3

          # repo | workflow name
          PIPELINES = [
            ("firestorm-lightning-data", "Update Lightning Data (GOES-R GLM)"),
            ("firestorm-aircraft-data",  "Update Aircraft Data"),
            ("firestorm-wind-data",      "Update GFS Wind Data"),
            ("firestorm-hrrr-data",      "Update HRRR Wind Data"),
            ("firestorm-news-data",      "Update Fire News Intelligence"),
            ("firestorm-aqi-data",       "Update AQI Data"),
            ("firestorm-satellite-data", "Update Satellite TLEs"),
            ("firestorm-spread-data",    "Update Fire Spread Forecast (PyreCast/ELMFIRE)"),
            ("firestorm-firms-data",     "update-firms"),
            ("firestorm-goes-fire-data", "Update GOES Fire Data (ABI FDC)"),
            ("firestorm-imsr-data",      "Update IMSR Data (NICC Incident Management Situation Report)"),
            ("firestorm-ngfs-data",      "Update NGFS Data (CIMSS/SSEC SCENE)"),
            ("firestorm-potential-data", "Update Fire Potential Data (NWCG 7-Day)"),
            ("firestorm-raws-data",      "Update RAWS Station Data (FEMS)"),
            ("firestorm-cams-aerosol-data", "Update CAMS Aerosol Data"),
            ("firestorm-cameras",        "Update Wildfire Cameras (AlertWest)"),
            ("firestorm-industrial-sites", "update-industrial-sites"),
          ]

          # Self-reported coverage sidecars: repo | path | min coverage %
          SIDECARS = [
            ("firestorm-spread-data", "data/health.json", 100.5),  # TEMP negative test
          ]

          def gh(path):
              cmd = ["gh", "api", path]
              out = subprocess.run(cmd, capture_output=True, text=True, timeout=90)
              if out.returncode != 0:
                  raise RuntimeError(out.stderr.strip()[:200])
              return json.loads(out.stdout)

          problems = []

          for repo, wf in PIPELINES:
              try:
                  d = gh(f"repos/{OWNER}/{repo}/actions/runs?per_page=100")
              except Exception as e:
                  problems.append(f"**{repo}** — could not read run history: {e}")
                  continue
              runs = [r for r in d.get("workflow_runs", []) if r.get("name") == wf]
              if not runs:
                  problems.append(f"**{repo}** — no runs found for workflow `{wf}` "
                                  f"(renamed? then this monitor is blind to it)")
                  continue
              streak = 0
              for r in runs:
                  if r.get("conclusion") == "failure":
                      streak += 1
                  else:
                      break
              if streak >= STREAK_THRESHOLD:
                  ok = next((r["created_at"] for r in runs if r.get("conclusion") == "success"), None)
                  if ok:
                      t = datetime.datetime.fromisoformat(ok.rstrip("Z")).replace(tzinfo=datetime.timezone.utc)
                      age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
                      when = f"{age/24:.1f} days ago" if age >= 48 else f"{age:.0f}h ago"
                  else:
                      when = "not in the last 100 runs"
                  problems.append(f"**{repo}** — {streak} consecutive failures, "
                                  f"last success {when}")

          for repo, path, min_cov in SIDECARS:
              url = f"https://raw.githubusercontent.com/{OWNER}/{repo}/main/{path}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      h = json.loads(r.read())
              except Exception as e:
                  problems.append(f"**{repo}** — health sidecar unreadable: {e}")
                  continue
              st = h.get("status")
              cov = float(h.get("coverage_pct") or 0)
              if st == "down":
                  problems.append(f"**{repo}** — pipeline self-reports status=down")
              elif cov < min_cov:
                  miss = len(h.get("missing_fires") or [])
                  problems.append(f"**{repo}** — coverage {cov}% below {min_cov}% "
                                  f"(status={st}, {miss} missing)")

          TITLE = "🚨 Pipeline health: failing feeds detected"

          existing = gh(f"repos/{OWNER}/firestorm-spread-data/issues?state=open&per_page=50")
          match = next((i for i in existing if i.get("title") == TITLE), None)

          if problems:
              body = ("Automated check found pipelines that are broken or serving "
                      "incomplete data.\n\n"
                      + "\n".join(f"- {p}" for p in problems)
                      + "\n\n---\nA single failure usually self-heals on the next cron tick; "
                      f"{STREAK_THRESHOLD}+ in a row means something structural changed "
                      "upstream (renamed file, rotated credential, changed schema).\n\n"
                      "Run `firestorm-health` locally for the full picture. "
                      "This issue closes automatically when everything recovers.")
              if match:
                  subprocess.run(["gh", "api", "-X", "POST",
                                  f"repos/{OWNER}/firestorm-spread-data/issues/{match['number']}/comments",
                                  "-f", f"body={body}"], check=False)
                  print(f"updated issue #{match['number']}")
              else:
                  subprocess.run(["gh", "api", "-X", "POST",
                                  f"repos/{OWNER}/firestorm-spread-data/issues",
                                  "-f", f"title={TITLE}", "-f", f"body={body}"], check=False)
                  print("opened new issue")
              print("\n".join(problems))
              raise SystemExit(1)
          else:
              if match:
                  subprocess.run(["gh", "api", "-X", "PATCH",
                                  f"repos/{OWNER}/firestorm-spread-data/issues/{match['number']}",
                                  "-f", "state=closed"], check=False)
                  subprocess.run(["gh", "api", "-X", "POST",
                                  f"repos/{OWNER}/firestorm-spread-data/issues/{match['number']}/comments",
                                  "-f", "body=All pipelines recovered. Closing."], check=False)
                  print(f"closed issue #{match['number']}")
              print(f"all {len(PIPELINES)} pipelines healthy")
          PY
